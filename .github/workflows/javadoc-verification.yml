name: Verify that the Javadoc is valid on PRs
on:
  pull_request:

jobs:
  build:
    name: Verify Javadoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      # The `releases` profile attaches a javadoc jar, so a javadoc failure would break a release.
      - name: Build the Javadoc
        run: mvn --batch-mode javadoc:javadoc
